# The prototype itself is a self-contained index.html; the build step only
# assembles the publish directory and builds the pitch deck into /marketing.
[build]
  publish = "_site"
  command = "bash netlify-build.sh"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The prototype changes often; don't let the browser pin an old copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/identity/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The deck's assets are content-hashed by the build; cache them hard.
[[headers]]
  for = "/marketing/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve the brand identity at /identity without changing the URL.
[[redirects]]
  from = "/identity"
  to = "/brand/identity-ar.html"
  status = 200

[[redirects]]
  from = "/identity/"
  to = "/brand/identity-ar.html"
  status = 200

[[redirects]]
  from = "/identity/min"
  to = "/brand/identity-min-ar.html"
  status = 200

# The decks' assets are content-hashed by the build; cache them hard.
[[headers]]
  for = "/domain/business_model/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The decks are single-page apps; deep links like /marketing/5 need the rewrite.
[[redirects]]
  from = "/marketing/*"
  to = "/marketing/index.html"
  status = 200

[[redirects]]
  from = "/domain/business_model/*"
  to = "/domain/business_model/index.html"
  status = 200

# The manuals' assets are content-hashed by the build; cache them hard.
[[headers]]
  for = "/manual/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/manual/merchant/*"
  to = "/manual/merchant/index.html"
  status = 200

[[redirects]]
  from = "/manual/customer/*"
  to = "/manual/customer/index.html"
  status = 200
