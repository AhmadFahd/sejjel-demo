# Static site: index.html is self-contained, so there is nothing to build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The prototype changes often; don't let the browser pin an old copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/identity/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Serve the brand identity at /identity without changing the URL.
[[redirects]]
  from = "/identity"
  to = "/brand/identity-ar.html"
  status = 200

[[redirects]]
  from = "/identity/"
  to = "/brand/identity-ar.html"
  status = 200

[[redirects]]
  from = "/identity/min"
  to = "/brand/identity-min-ar.html"
  status = 200
