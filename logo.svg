<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-label="Sejjel logo">
  <!-- two-color palette: #EDE9E6 (cream) and #5C4F4A (brown) -->
  <rect width="1040" height="560" rx="32" fill="#EDE9E6"/>

  <g fill="none" stroke="#5C4F4A" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- seen (right): two teeth + wide bowl sweeping under them -->
    <path d="M 985 205 L 985 285 Q 985 335 935 335 L 905 335 Q 860 335 860 290 L 860 265"/>
    <path d="M 795 265 L 795 290 Q 795 335 750 335 L 720 335 Q 675 335 675 290 L 675 275"/>
    <path d="M 955 330 Q 965 465 780 465 Q 645 465 622 372"/>
    <!-- lam (left): stem + bowl -->
    <path d="M 225 150 L 225 320 Q 225 390 155 390 L 110 390 Q 60 390 60 340 L 60 305"/>
  </g>

  <!-- checkmark: cream fill with brown outline (still only two colors) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 375 295 L 468 400 L 640 150" stroke="#5C4F4A" stroke-width="76"/>
    <path d="M 375 295 L 468 400 L 640 150" stroke="#EDE9E6" stroke-width="36"/>
  </g>

  <!-- dot below (jeem dot) -->
  <circle cx="470" cy="480" r="30" fill="#EDE9E6" stroke="#5C4F4A" stroke-width="14"/>

  <!-- shadda above -->
  <path d="M 568 58 Q 583 38 598 58 Q 613 78 628 58 L 628 22"
        fill="none" stroke="#5C4F4A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
