<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-label="Sejjel logo">
  <!-- two-color palette: letterforms #5C4F4A, checkmark/dot/shadda #EDE9E6 -->

  <g fill="none" stroke="#5C4F4A" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- seen (right): two teeth -->
    <path d="M 982 240 L 982 284 Q 982 330 934 330 L 908 330 Q 866 330 866 288 L 866 262"/>
    <path d="M 800 262 L 800 288 Q 800 330 756 330 L 728 330 Q 686 330 686 290 L 686 272"/>
    <!-- seen connector: sweeps under the teeth and joins the checkmark's long arm -->
    <path d="M 968 318 Q 978 466 782 466 Q 640 466 596 348 Q 578 298 556 268"/>
    <!-- lam (left): tall stem + bowl curling up -->
    <path d="M 222 132 L 222 292 Q 222 356 158 356 L 120 356 Q 62 356 62 302 L 62 278"/>
    <!-- connector from the checkmark's short arm into the lam -->
    <path d="M 386 274 Q 336 348 258 348 L 230 348"/>
  </g>

  <g fill="none" stroke="#EDE9E6" stroke-linecap="round" stroke-linejoin="round">
    <!-- checkmark (jeem body) -->
    <path d="M 388 272 L 470 388 L 648 142" stroke-width="62"/>
    <!-- shadda above -->
    <path d="M 560 96 Q 574 76 588 96 Q 602 116 616 96 L 616 58" stroke-width="16"/>
  </g>

  <!-- dot below the checkmark -->
  <circle cx="468" cy="462" r="30" fill="#EDE9E6"/>
</svg>
